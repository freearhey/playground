name: "💻 New app"
description: "Submit a request to add a new app to the list"
labels: []
body:
  - type: input
    id: website
    attributes:
      label: Website
      description: Link to the app's website. For Android, iPhone, iPad, Apple Watch, Apple TV, Apple Vision Pro, Android TV, WebOS, Roku, Xbox and Google Chrome apps the link should lead to a reputable app store or source code
    validations:
      required: true
  - type: input
    id: source_code
    attributes:
      label: Source Code (optional)
      description: A link to the source code of the application, if available
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
